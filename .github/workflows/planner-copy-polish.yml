name: Planner Copy Polish

on:
  push:
    branches: [feat/planner-copy-clarity]

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply copy and direction cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def swaps(text, pairs, label):
              for old, new in pairs:
                  n = text.count(old)
                  if n != 1:
                      raise SystemExit(f"{label}: expected 1 occurrence of {old[:70]!r}, found {n}")
                  text = text.replace(old, new)
              return text

          router_path = Path('housedelivery-v2/src/components/project-planning-router.tsx')
          router = router_path.read_text()
          router = swaps(router, [
              ('Housing pathway / Start here', 'Plan a Housing Project'),
              ('            What are you\n            <br />\n            <span className="text-white/38">planning?</span>', '            Who are you\n            <br />\n            <span className="text-white/38">planning for?</span>'),
              ('          <p className="mt-8 max-w-2xl text-base leading-7 text-white/58 sm:text-lg sm:leading-8">\n            Choose the path that best reflects who is planning and the scale of the housing need.\n          </p>\n', ''),
              ('              Individual Home\n', '              Individual Homeowner\n'),
              ('              Are you planning:\n', '              How many homes are you planning?\n'),
              (' /> Change planning group\n', ' /> Change selection\n'),
          ], 'router')
          router_path.write_text(router)

          p = Path('housedelivery-v2/src/components/first-nations-project-planner.tsx')
          s = p.read_text()

          s = swaps(s, [
              ('  include: "Include in My Funding Review",', '  include: "Include for Review",'),
              ('  { label: "Project Intake", eyebrow: "Start" },', '  { label: "Project Basics", eyebrow: "Start" },'),
              ('  { label: "My Project", eyebrow: "Build" },', '  { label: "Choose Homes", eyebrow: "Build" },'),
              ('  { label: "Quick Estimate", eyebrow: "Understand" },', '  { label: "Early Range", eyebrow: "Understand" },'),
              ('  { label: "Refine Project", eyebrow: "Refine" },', '  { label: "Project Details", eyebrow: "Refine" },'),
              ('  { label: "Design Direction", eyebrow: "Shape" },', '  { label: "Design Homes", eyebrow: "Shape" },'),
              ('  { label: "Funding Pathways", eyebrow: "Explore" },', '  { label: "Funding", eyebrow: "Explore" },'),
              ('  { label: "Scale & Readiness", eyebrow: "Prepare" },', '  { label: "Readiness", eyebrow: "Prepare" },'),
              ('  { label: "Project Review", eyebrow: "Submit" },', '  { label: "Submit for Review", eyebrow: "Submit" },'),
              ('  { label: "Define Housing Need", eyebrow: "Start" },', '  { label: "Housing Need", eyebrow: "Start" },'),
              ('  { label: "Select Homes", eyebrow: "Build" },', '  { label: "Choose Homes", eyebrow: "Build" },'),
              ('  { label: "Design Project Homes", eyebrow: "Design" },', '  { label: "Design Homes", eyebrow: "Design" },'),
              ('  { label: "Project Readiness", eyebrow: "Prepare" },', '  { label: "Readiness", eyebrow: "Prepare" },'),
              ('  { label: "Funding & Grant Corridors", eyebrow: "Explore" },', '  { label: "Funding & Grants", eyebrow: "Explore" },'),
              ('  { label: "Review Project", eyebrow: "Review" },', '  { label: "Review", eyebrow: "Review" },'),
              ('  { label: "Project Review / LOU", eyebrow: "Advance" },', '  { label: "Submit for Review", eyebrow: "Advance" },'),
              ('              You remain inside the active project. Close this view to select a\n              quantity, delivery group and exterior direction.', '              Close this view to continue building your project.'),
              ('        <p className="mt-1 text-[10px] leading-4 text-black/42">\n          Architecture, plans and walkthrough\n        </p>\n', ''),
              ('        <p className="mt-1 text-[10px] leading-4 text-black/42">\n          Choose the design direction\n        </p>\n', ''),
              ('        <p className="mt-1 text-[10px] leading-4 text-black/42">\n          Reopen saved design selections\n        </p>\n', ''),
              ('My Look Book — Save a Design First', 'My Look Book — Complete Design First'),
              ('Look Book — Save this design first', 'Look Book available after design completion'),
              ('        title="Begin with the community need."', '        title="What housing does your community need?"'),
              ('        intro="Set an initial planning target for the community. The selected project portfolio becomes the source of truth for downstream home totals, design groups, readiness and reports."', '        intro="Start with what you know today. You can refine this later."'),
              ('<FieldLabel>Initial homes needed / planning target</FieldLabel>', '<FieldLabel>Approximate homes needed</FieldLabel>'),
              ('<FieldLabel>Site pattern</FieldLabel>', '<FieldLabel>Site arrangement</FieldLabel>'),
              ('<FieldLabel>Delivery horizon</FieldLabel>', '<FieldLabel>Project timing</FieldLabel>'),
              ('        title="Begin with the project."', '        title="Tell us about the project."'),
              ('        intro="Create a short working picture of the site, housing programme and delivery readiness. Every answer can be refined as the project develops."', '        intro="Start with what you know today. You can refine the project as it develops."'),
              ('        title="Build the housing mix."', '        title="Choose the homes for this project."'),
              ('        intro="Select the home models, quantities and delivery groups for this project. Architecture details stay in context; design configuration happens in the next dedicated project stage."', '        intro="Add the home models and quantities you want to explore. You can change them later."'),
              ('>Working homes</p>', '>Homes selected</p>'),
              ('Project Overview / Homes &amp; Quantities', 'Homes in My Project'),
              ('                    Available to explore. Project selection, Design My Home and Look Book\n                    configuration are coming soon.', '                    Available to explore. Project selection and design tools are coming soon.'),
              ('        title="A range, not a quotation."', '        title="Early project range."'),
              ('        intro="The estimate architecture separates Low, Base and High planning cases. No automatic finish uplift, volume discount, climate percentage, off-grid amount, appliance package, accessibility percentage or training formula is applied."', '        intro="An initial planning range based on the homes currently in your project. It will be refined as project requirements are confirmed."'),
              ('        title="Refine Your Project"', '        title="Tell us what you know."'),
              ('          ? "These answers help House Delivery better understand the community, site, delivery needs and funding context. Every answer can remain unknown while the project is still taking shape."', '          ? "Add the project details that are known today. Anything can be refined later."'),
              ('          : "These answers help House Delivery better understand the site, housing approach, delivery responsibilities and commercial context. Every answer can remain unknown while the project is still taking shape."}', '          : "Add the project details that are known today. Anything can be refined later."}'),
              ('"Configure the homes in this project."', '"Design each home type."'),
              ('"Make the direction visible."', '"Design each home type."'),
              ('"Apply one design to every matching home by default. Create another design group only when part of that model quantity needs a different exterior expression or package direction."', '"Create one Look Book for each home type. Add another Design Group only when some homes need a different direction."'),
              ('"Create one design per home type and assign it to every matching home by default. Add a design group only when part of that quantity needs a different direction."', '"Create one Look Book for each home type. Add another Design Group only when some homes need a different direction."'),
              ('          <p className="mt-3 text-sm leading-6 text-white/58">Your project totals and saved design assignments remain intact.</p>\n', ''),
              ('Configure Next Design Group', 'Design Next Group'),
              ('Saved design group', 'Design Group'),
              ('"Design completed" : "Design remaining"', '"Complete" : "Not complete"'),
              ('placeholder="Optional notes that should travel with this design package"', 'placeholder="Optional notes for this design group"'),
              ('"Corridors to explore."', '"Funding and grant opportunities to explore."'),
              ('"Potential pathways to review."', '"Funding opportunities to explore."'),
              ('"These contextual matches support an early funding conversation. They are not eligibility findings, approvals or guarantees, and no potential funding is deducted from project feasibility."', '"Based on what you have entered, these programs may be relevant. House Delivery can review them with you; eligibility and approval remain subject to each program."'),
              ('"These contextual pathways support an early owner, proponent and financing conversation. They are not eligibility findings, approvals or guarantees, and no potential funding is deducted from project feasibility."', '"Based on what you have entered, these programs may be relevant. House Delivery can review them with you; eligibility and approval remain subject to each program."'),
              ('        title="Record what is known today."', '        title="Tell us what you know today."'),
              ('        intro="Projects do not need to have every answer today. Record what is currently known so House Delivery can understand where the project stands and what may need to be explored next."', '        intro="You do not need every answer. Choose what best reflects the project today."'),
              ('        title="Review one project record."', '        title="Review your project."'),
              ('        intro="Homes, quantities, delivery groups, design groups, Look Books and readiness answers below all come from the same saved project state. Edit any section before creating the Opportunity Report."', '        intro="Check your homes, Look Books and readiness answers. Edit anything before creating the Opportunity Report."'),
              ('        title="Two different questions."', '        title="Review project readiness."'),
              ('        intro="Scale describes the opportunity. Readiness describes what is known today. Neither is a government, lender or funding-program score."', '        intro="See what is known today and what still needs to be confirmed."'),
              ('title="A clearer next conversation."', 'title="Your Opportunity Report is ready."'),
              ('intro="This report carries the opportunity, portfolio, project design groups, readiness information and items to confirm into a structured House Delivery review."', 'intro="Review or download your project summary, then send it to House Delivery when you are ready."'),
              ('        title="Carry the full project forward."', '        title="Send your project to House Delivery."'),
              ('"Submit the organized project record for House Delivery review. This opens the pathway toward an LOU; it does not itself create a legally binding agreement."', '"Submit the project for House Delivery review. House Delivery will review it before preparing any LOU or next-stage authorization."'),
              ('"Your opportunity, portfolio, delivery groups, design records, refinement answers, funding-review choices and readiness profile are attached to this project-aware request."', '"Submit the project for House Delivery review. Your saved project details and design records will be included."'),
              ('The project record has moved forward intact.', 'Project received.'),
          ], 'planner copy')

          n = s.count('"Continue to House Delivery Review"')
          if n != 2: raise SystemExit(f'expected 2 House Delivery Review labels, found {n}')
          s = s.replace('"Continue to House Delivery Review"', '"Send to House Delivery Review"')

          tech = '''\n      <div className="mt-12 grid gap-4 sm:grid-cols-2 lg:grid-cols-5">\n        {["Visual Direction", "Planning Allowance", "Supplier-Informed", "Technical Review Required", "Project-Specific Approval Required"].map((status) => (\n          <div key={status} className="border-t border-black/16 pt-4 text-[9px] font-semibold uppercase leading-5 tracking-[0.14em] text-black/46">{status}</div>\n        ))}\n      </div>'''
          if s.count(tech) != 1: raise SystemExit('technical status strip not found')
          s = s.replace(tech, '')

          calc_pattern = re.compile(r'  const designProgress = getPlannerDesignProgress\(state\.portfolio, catalog\);\n  const includedHomeTypes = projectSummary\.lines\.map\(\(\{ model \}\) =>\n    getPlannerHomeName\(model\.name\),\n  \);\n  const completedHomeTypes = projectSummary\.lines\.flatMap\(\(\{ line, model \}\) =>\n    line\.designVariations\.some\(\(variation\) => variation\.status === "complete"\)\n      \? \[getPlannerHomeName\(model\.name\)\]\n      : \[\],\n  \);\n  const remainingHomeTypes = projectSummary\.lines\.flatMap\(\(\{ line, model \}\) =>\n    model\.designChapters\.length > 0 &&\n    line\.designVariations\.some\(\(variation\) => variation\.status !== "complete"\)\n      \? \[getPlannerHomeName\(model\.name\)\]\n      : \[\],\n  \);\n')
          s, n = calc_pattern.subn('', s)
          if n != 1: raise SystemExit(f'sticky calculations: found {n}')

          action_pattern = re.compile(r'  const stickyActionLabel = isFirstNationsProject\n.*?\n  function resetPlanner\(\) \{', re.S)
          replacement = '''  const stickyActionLabel = isFirstNationsProject\n    ? [\n        "Continue to Choose Homes",\n        "Continue to Design Homes",\n        "Continue to Readiness",\n        "Continue to Funding & Grants",\n        "Continue to Review",\n        "Create Opportunity Report",\n        "Continue to Project Review",\n        "View / Edit Project Homes",\n      ][state.step]\n    : [\n        "Continue to Choose Homes",\n        "Continue to Early Range",\n        "Continue to Project Details",\n        "Continue to Design Homes",\n        "Continue to Funding",\n        "Continue to Readiness",\n        "Create Opportunity Report",\n        "Continue to Project Review",\n        "View / Edit Project Homes",\n      ][state.step];\n  const bottomActionLabel = isFirstNationsProject\n    ? [\n        "Continue to Choose Homes",\n        "Continue to Design Homes",\n        "Continue to Readiness",\n        "Continue to Funding & Grants",\n        "Continue to Review",\n        "Create Opportunity Report",\n      ][state.step]\n    : [\n        "Continue to Choose Homes",\n        "Continue to Early Range",\n        "Continue to Project Details",\n        "Continue to Design Homes",\n        "Continue to Funding",\n        "Continue to Readiness",\n        "Create Opportunity Report",\n      ][state.step];\n\n  function resetPlanner() {'''
          s, n = action_pattern.subn(replacement, s)
          if n != 1: raise SystemExit(f'action label block: found {n}')

          s = swaps(s, [
              ('            onClick={() => goToStep(isFirstNationsProject ? stickyNextStep : 1)}', '            onClick={() => goToStep(stickyNextStep)}'),
              ('            disabled={isFirstNationsProject && !canContinue}', '            disabled={!canContinue}'),
              ('              {projectSummary.totalHomes} {projectSummary.totalHomes === 1 ? "home" : "homes"} · {projectSummary.modelCount} {projectSummary.modelCount === 1 ? "model" : "models"} · {projectSummary.phaseCount} delivery {projectSummary.phaseCount === 1 ? "group" : "groups"} · {designProgress.completedDesigns} of {designProgress.totalDesignGroups} {designProgress.totalDesignGroups === 1 ? "design group" : "design groups"} complete', '              {projectSummary.totalHomes} {projectSummary.totalHomes === 1 ? "home" : "homes"} · {projectSummary.modelCount} {projectSummary.modelCount === 1 ? "model" : "models"}'),
          ], 'sticky bar')

          detail_pattern = re.compile(r'\n            <p className="mt-2 text-\[10px\] leading-4 text-black/46">\n              \{includedHomeTypes\.length.*?\n            </p>', re.S)
          s, n = detail_pattern.subn('', s)
          if n != 1: raise SystemExit(f'sticky detail sentence: found {n}')

          p.write_text(s)
          PY

      - name: Validate patch
        shell: bash
        run: |
          git diff --check
          test -n "$(git status --short housedelivery-v2/src/components/project-planning-router.tsx housedelivery-v2/src/components/first-nations-project-planner.tsx)"

      - name: Commit polished planner copy
        shell: bash
        run: |
          rm .github/workflows/planner-copy-polish.yml .planner-copy-trigger
          git config user.name "House Delivery Automation"
          git config user.email "actions@users.noreply.github.com"
          git add housedelivery-v2/src/components/project-planning-router.tsx housedelivery-v2/src/components/first-nations-project-planner.tsx .github/workflows/planner-copy-polish.yml .planner-copy-trigger
          git commit -m "copy: simplify project planner journey"
          git push origin HEAD:feat/planner-copy-clarity
